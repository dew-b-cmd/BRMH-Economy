name: Update economy and deploy Pages
on:
  workflow_dispatch:
    inputs:
      force:
        description: Recheck all sources and rerun Kronos
        type: boolean
        default: false
  schedule:
    - cron: '17 3,10,22 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-economy.yml'
      - 'scripts/**'
      - 'worker/**'
      - 'kronos-source.zip'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.pdf'
permissions: {}
concurrency:
  group: economy-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      snapshot_sha: ${{ steps.build.outputs.snapshot_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract original backend and test
        run: |
          python -m zipfile -e kronos-source.zip .runtime
          python -m unittest discover -s scripts -p 'test_*.py'
          for file in *.js; do node --check "$file"; done
          node --test worker/*.test.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .runtime/kronos-economy/.research-cache/models
          key: kronos-cpu-v1-${{ runner.os }}-${{ hashFiles('kronos-source.zip') }}
      - name: Install model dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy<3' 'pandas>=2.2,<3' einops==0.8.1 huggingface_hub==0.33.1 tqdm==4.67.1 safetensors==0.6.2
      - name: Collect and run model when needed
        env:
          CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FORCE_REFRESH: ${{ github.event_name == 'push' || inputs.force }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python scripts/update_economy.py --force
          else
            python scripts/update_economy.py
          fi
          python -m json.tool data/economy.json >/dev/null
      - name: Refresh disclosure issuer directories
        env:
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          python scripts/build_disclosure_catalog.py
          python scripts/build_dart_search.py
          python scripts/build_sec_search.py
      - name: Persist snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/economy.json data.js data/disclosure-catalog data/dart-recent data/sec-recent
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh economy snapshots'
            git push origin HEAD:main
          fi
      - name: Build public site only
        id: build
        env:
          DISCLOSURE_API_URL: ${{ vars.DISCLOSURE_API_URL }}
        run: |
          mkdir -p _site/data
          cp *.html *.css *.js *.pdf kronos-source.zip _site/
          cp data/economy.json _site/data/
          cp -R data/disclosure-catalog _site/data/
          cp -R data/dart-recent _site/data/
          cp -R data/sec-recent _site/data/
          python - <<'PY'
          import os
          from pathlib import Path
          import re

          gateway = os.environ.get('DISCLOSURE_API_URL', '').rstrip('/')
          if gateway and not re.fullmatch(r'https://brmh-economy-disclosures\.[a-z0-9-]+\.workers\.dev', gateway):
              raise SystemExit('Invalid DISCLOSURE_API_URL format')
          dashboard = Path('_site/economy.html')
          placeholder = '<meta name="disclosure-api" content="">'
          html = dashboard.read_text(encoding='utf-8')
          if html.count(placeholder) != 1:
              raise SystemExit('Expected one disclosure gateway meta tag')
          dashboard.write_text(html.replace(placeholder, f'<meta name="disclosure-api" content="{gateway}">'), encoding='utf-8')
          PY
          touch _site/.nojekyll
          python -m http.server 8765 --bind 127.0.0.1 --directory _site > /tmp/economy-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl --retry 5 --retry-connrefused --fail http://127.0.0.1:8765/economy.html >/dev/null
          curl --fail http://127.0.0.1:8765/data/economy.json | python -m json.tool >/dev/null
          echo "snapshot_sha=$(sha256sum data/economy.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy directly
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published JSON
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ needs.collect.outputs.snapshot_sha }}
          REQUIRE_FRESH: ${{ github.event_name == 'push' || inputs.force }}
        run: |
          curl --fail --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/data/economy.json?run=$GITHUB_RUN_ID" -o /tmp/economy.json
          python -m json.tool /tmp/economy.json >/dev/null
          test "$(sha256sum /tmp/economy.json | cut -d' ' -f1)" = "$EXPECTED_SHA"
          curl --fail --retry 5 --retry-all-errors "${PAGE_URL%/}/" -o /tmp/economy-home.html
          curl --fail --retry 5 --retry-all-errors "${PAGE_URL%/}/economy.html" -o /tmp/economy-dashboard.html
          grep -Fq 'lecture.pdf' /tmp/economy-home.html
          grep -Fq 'kronos-pages.js' /tmp/economy-dashboard.html
          grep -Fq 'dart-pages.js' /tmp/economy-dashboard.html
          curl --fail --retry 5 --retry-all-errors "${PAGE_URL%/}/data/dart-recent/status.json?run=$GITHUB_RUN_ID" | python -m json.tool >/dev/null
          grep -Fq 'sec-pages.js' /tmp/economy-dashboard.html
          curl --fail --retry 5 --retry-all-errors "${PAGE_URL%/}/data/sec-recent/status.json?run=$GITHUB_RUN_ID" | python -m json.tool >/dev/null
          for provider in dart sec; do
            curl --fail --retry 5 --retry-all-errors "${PAGE_URL%/}/data/disclosure-catalog/$provider-updated.json?run=$GITHUB_RUN_ID" | python -m json.tool >/dev/null
          done
          if [ "$REQUIRE_FRESH" = true ]; then
            python - <<'PY'
          import json
          with open('/tmp/economy.json', encoding='utf-8') as file:
              data = json.load(file)
          checks = {'exports:8542', 'exports:3304', 'dart', 'sec:NVDA', 'sec:AAPL',
                    'analysis:NVDA', 'analysis:AAPL', 'production', 'sector', 'market', 'forecast'}
          stale = sorted(name for name in checks if data['refresh'].get(name, {}).get('state') != 'ok')
          if stale:
              raise SystemExit('Live verification failed: ' + ', '.join(stale))
          forecast = data['forecast']
          assert forecast['revision'] == data['market']['revision'] and len(forecast['rows']) == 5
          assert forecast['model'] == 'NeoQuasar/Kronos-small'
          PY
          fi
